name: TenantFlow CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      configuration: ${{ steps.filter.outputs.configuration }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

            configuration:
              - 'docker-compose.yml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  configuration:
    name: Compose Configuration

    needs: changes

    if: needs.changes.outputs.configuration == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose Configuration
        run: docker compose config --quiet
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: configuration-check
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: configuration-check
          STACK_SECRET_SERVER_KEY: configuration-check

  frontend:
    name: Frontend Build

    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_STACK_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }}
          NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY: ${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }}
          STACK_SECRET_SERVER_KEY: ${{ secrets.STACK_SECRET_SERVER_KEY }}

  docker:
    name: Docker Build

    needs:
      - changes
      - frontend

    if: needs.changes.outputs.frontend == 'true' && needs.frontend.result == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_STACK_PROJECT_ID=${{ secrets.NEXT_PUBLIC_STACK_PROJECT_ID }} \
            --build-arg NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY=${{ secrets.NEXT_PUBLIC_STACK_PUBLISHABLE_CLIENT_KEY }} \
            --build-arg STACK_SECRET_SERVER_KEY=${{ secrets.STACK_SECRET_SERVER_KEY }} \
            -t tenantflow-frontend:ci \
            ./frontend
